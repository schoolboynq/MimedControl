[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimedcontrol"
version = "0.2.1"
description = "Point, click, drag and scroll with your hands, tracked in 3D by two ordinary webcams."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/mimedcontrol/models/LICENSE"]
requires-python = ">=3.10"
keywords = ["hand tracking", "gestures", "webcam", "stereo", "two cameras", "mouse", "accessibility", "mediapipe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.12,<5",
    "pynput>=1.8,<2; sys_platform == 'win32' or sys_platform == 'darwin'",
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "winrt-runtime>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Media.Capture>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Media.Capture.Frames>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Media.Devices>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Media.MediaProperties>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2,<5; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<5; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.gui-scripts]
mimedcontrol = "mimedcontrol.app:main"

[project.urls]
Homepage = "https://github.com/schoolboynq/MimedControl"
Issues = "https://github.com/schoolboynq/MimedControl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mimedcontrol = ["models/*.onnx", "models/LICENSE", "assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
